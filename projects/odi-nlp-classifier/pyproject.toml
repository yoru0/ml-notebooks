[project]
name = "odi-nlp-classifier"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "joblib>=1.6.0",
    "numpy>=2.5.5",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "scikit-learn==1.6.1",
    "xgboost>=3.0.1,<3.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
notebook = [
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
    "pandas>=3.1.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "wordcloud>=1.9.6",
]
