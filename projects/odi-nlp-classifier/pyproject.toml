[project]
name = "odi-nlp-classifier"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn==1.6.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "wordcloud>=1.9.6",
    "xgboost>=3.0.1,<3.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
