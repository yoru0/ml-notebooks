[project]
name = "emotion-recognition"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "gdown>=6.5.1",
    "ipython>=8.39.0",
    "keras>=3",
    "librosa>=0.10",
    "matplotlib>=3.10.9",
    "numpy>=1.26",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "soundfile>=0.14.0",
    "tensorflow>=2.16",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
