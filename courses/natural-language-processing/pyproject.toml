[project]
name = "natural-language-processing"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "gensim>=4.4.0",
    "joblib>=1.6.0",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn==1.6.1",
    "seaborn>=0.13.2",
    "skl2onnx>=1.19.1",
    "spacy>=3.8.7",
    "tensorflow>=2.21.0",
    "transformers<5",
    "wordcloud>=1.9.6",
    "xgboost>=3.0.1,<3.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
