[project]
name = "speech-recognition"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "audioop-lts>=0.2.1",
    "gtts>=2.5.4",
    "librosa>=1.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pydub>=0.25.1",
    "scipy>=1.16.0",
    "soundfile>=0.13.1",
    "tensorflow>=2.21.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "transformers<5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
